modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "azureframelib"
version = "${version}"
displayName = "AzureFrameLib"
authors = "Azureddraig"
description = '''
Shared library and dynamic resource framework for Minecraft mods.
'''

[[mixins]]
config = "azureframelib.mixins.json"

[[mixins]]
config = "azureframelib.geckolib.mixins.json"

[[dependencies.azureframelib]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.azureframelib]]
modId = "minecraft"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.azureframelib]]
modId = "architectury"
type = "required"
versionRange = "[20.1.17,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.azureframelib]]
modId = "geckolib"
type = "optional"
versionRange = "[5.5,)"
ordering = "AFTER"
side = "BOTH"
