// Multi-version coordinator for AzureFrameLib.
// Each Minecraft version lives in its own self-contained subfolder (1.20.1, 1.21.1, 1.21.11, 26.1, 26.2)
// and shares build_number.txt in this root folder.

def allVersions = ["1.20.1", "1.21.1", "1.21.11", "26.1", "26.2"]
def activeVersions = ["1.20.1", "1.21.1"]
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

allVersions.each { ver ->
    def safeVer = ver.replace('.', '_')
    ["compileJava", "assemble", "build", "publishToMavenLocal", "deployToDev"].each { taskName ->
        tasks.register("${taskName}_${safeVer}", Exec) {
            group = "azureframelib (${ver})"
            description = "Runs ${taskName} inside ${ver}/"
            workingDir = file(ver)
            def wrapper = file("${ver}/${isWindows ? 'gradlew.bat' : 'gradlew'}").absolutePath
            commandLine = isWindows ? ["cmd", "/c", wrapper, taskName, "--console=plain"] : [wrapper, taskName, "--console=plain"]
        }
    }
}

["compileJava", "assemble", "build", "publishToMavenLocal", "deployToDev"].each { taskName ->
    tasks.register(taskName) {
        group = "azureframelib"
        description = "Runs ${taskName} across active versions (${activeVersions.join(', ')})"
        dependsOn activeVersions.collect { ver -> "${taskName}_${ver.replace('.', '_')}" }
    }
}
