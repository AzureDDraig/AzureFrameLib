// Multi-version coordinator for AzureFrameLib.
// Each Minecraft version lives in its own self-contained subfolder (1.20.1, 1.21, 1.21.1, 1.21.8, 1.21.11, 26.1, 26.2, 26.3)
// and shares build_number.txt and gradle.properties (mod_version, mod_tag) in this root folder.

def allVersions = ["1.20.1", "1.21", "1.21.1", "1.21.8", "1.21.11", "26.1", "26.2", "26.3"]
def activeVersions = ["1.20.1", "1.21", "1.21.1", "1.21.8", "1.21.11", "26.1", "26.2", "26.3"]
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

def buildNumberFile = file("build_number.txt")
if (!buildNumberFile.exists()) {
    buildNumberFile.text = "001"
}

tasks.register("incrementBuildNumber") {
    onlyIf { !project.hasProperty("skipBuildIncrement") }
    doLast {
        boolean anyFailure = false
        gradle.taskGraph.allTasks.each { task ->
            if (task.state.failure != null) {
                anyFailure = true
            }
        }
        if (!anyFailure) {
            def current = buildNumberFile.text.trim().toInteger()
            def next = current + 1
            buildNumberFile.text = String.format("%03d", next)
            println "Incremented shared build number to ${String.format('%03d', next)}"
        }
    }
}

allVersions.each { ver ->
    def safeVer = ver.replace('.', '_')
    ["compileJava", "assemble", "build", "publishToMavenLocal", "deployToDev"].each { taskName ->
        tasks.register("${taskName}_${safeVer}", Exec) {
            group = "azureframelib (${ver})"
            description = "Runs ${taskName} inside ${ver}/"
            workingDir = file(ver)
            def wrapper = file("${ver}/${isWindows ? 'gradlew.bat' : 'gradlew'}").absolutePath
            def args = [taskName, "--console=plain", "-PskipBuildIncrement=true"]
            if (ver.startsWith("26.")) {
                def jdk25 = new File(System.getProperty("user.home"), ".gradle/jdks/eclipse_adoptium-25-amd64-windows.2")
                if (jdk25.exists()) {
                    environment "JAVA_HOME", jdk25.absolutePath
                }
            } else {
                def jdk21 = new File(System.getProperty("user.home"), ".gradle/jdks/eclipse_adoptium-21-amd64-windows.2")
                if (jdk21.exists()) {
                    environment "JAVA_HOME", jdk21.absolutePath
                }
            }
            commandLine = isWindows ? (["cmd", "/c", wrapper] + args) : ([wrapper] + args)
        }
    }
}

["compileJava", "assemble", "build", "publishToMavenLocal", "deployToDev"].each { taskName ->
    for (int i = 1; i < activeVersions.size(); i++) {
        def prev = "${taskName}_${activeVersions[i - 1].replace('.', '_')}"
        def curr = "${taskName}_${activeVersions[i].replace('.', '_')}"
        tasks.named(curr).configure { mustRunAfter(prev) }
    }
    tasks.register(taskName) {
        group = "azureframelib"
        description = "Runs ${taskName} across active versions (${activeVersions.join(', ')})"
        def subTasks = activeVersions.collect { ver -> "${taskName}_${ver.replace('.', '_')}" }
        dependsOn subTasks
        if (taskName == "deployToDev") {
            finalizedBy("incrementBuildNumber")
        }
    }
}
