plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    compileOnly "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

tasks.register("backupToRepo", Copy) {
    dependsOn sourcesJar, shadowJar, remapJar
    into "G:/Mod Backup Repository/${rootProject.archives_name}"
    
    into("Source/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from sourcesJar.archiveFile
        from shadowJar.archiveFile
    }
    
    into("Build/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from remapJar.archiveFile
    }
    
    onlyIf {
        (rootProject.buildNumberVal % 2) == 1
    }
}

tasks.register("deployToDev", Copy) {
    dependsOn remapJar, backupToRepo
    from remapJar.archiveFile
    into "C:/Users/Ddraig__/curseforge/minecraft/Instances/devfabric121/mods"
    
    doFirst {
        ["C:/Users/Ddraig__/curseforge/minecraft/Instances/devfabric121/mods",
         "C:/Users/Ddraig__/curseforge/minecraft/Instances/dev-fabric-121/mods"].each { path ->
            def targetDir = file(path)
            if (targetDir.exists()) {
                targetDir.listFiles().each { file ->
                    if (file.name.startsWith("${rootProject.archives_name}-fabric-") && file.name.endsWith(".jar")) {
                        println "Deleting old deploy jar: ${file.name}"
                        file.delete()
                    }
                }
            }
        }
    }
    doLast {
        def altDir = file("C:/Users/Ddraig__/curseforge/minecraft/Instances/dev-fabric-121/mods")
        if (altDir.exists()) {
            copy {
                from remapJar.archiveFile
                into altDir
            }
        }
    }
}
