loom {
    forge {
        mixinConfig "azureframelib.mixins.json"
        mixinConfig "azureframelib.geckolib.mixins.json"
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "../common/src/main/java"]
        }
        resources {
            srcDirs = ["src/main/resources", "../common/src/main/resources"]
        }
    }
}

configurations {
    embedLib
}

repositories {
    mavenCentral()
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modCompileOnly "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    compileOnly "software.bernie.geckolib:geckolib-forge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    compileOnly "org.xerial:sqlite-jdbc:3.43.0.0"
    embedLib "org.xerial:sqlite-jdbc:3.43.0.0"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }

    from(configurations.embedLib) {
        into "azureframelib/lib"
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("backupToRepo", Copy) {
    dependsOn sourcesJar, remapJar
    into "G:/Mod Backup Repository/${rootProject.archives_name}"

    into("Source/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from sourcesJar.archiveFile
    }

    into("Build/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from remapJar.archiveFile
    }

    onlyIf {
        (rootProject.buildNumberVal % 2) == 1
    }
}

tasks.register("deployToDev") {
    dependsOn remapJar, backupToRepo
    doLast {
        def instancesRoot = file("C:/Users/Ddraig__/curseforge/minecraft/Instances")
        def baseNames = ["dev-forge-12111", "devforge12111"]
        if (!instancesRoot.exists()) return
        def matchingInstances = instancesRoot.listFiles()?.findAll { dir ->
            dir.isDirectory() && baseNames.any { base ->
                dir.name.equalsIgnoreCase(base) || dir.name.toLowerCase().startsWith(base.toLowerCase() + " (")
            }
        } ?: []
        def cfProfiles = matchingInstances.findAll { new File(it, "minecraftinstance.json").exists() }
        def targets = cfProfiles.isEmpty() ? matchingInstances : cfProfiles
        targets.each { instDir ->
            def modsDir = new File(instDir, "mods")
            if (!modsDir.exists()) modsDir.mkdirs()
            modsDir.listFiles()?.each { f ->
                if (f.name.startsWith("${rootProject.archives_name}-forge-") && f.name.endsWith(".jar")) {
                    println "Deleting old deploy jar in ${instDir.name}: ${f.name}"
                    f.delete()
                }
            }
            copy {
                from remapJar.archiveFile
                into modsDir
            }
            println "Deployed ${remapJar.archiveFile.get().asFile.name} to ${modsDir.absolutePath}"
        }
    }
}
