architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    mavenCentral()
}

configurations {
    embedLib
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    embedLib "org.xerial:sqlite-jdbc:3.43.0.0"
    compileOnly "org.xerial:sqlite-jdbc:3.43.0.0"
}

processResources {
    from(configurations.embedLib) {
        into "azureframelib/lib"
    }
}

task devJar(type: Jar) {
    archiveClassifier = 'dev'
    from sourceSets.main.output
}
