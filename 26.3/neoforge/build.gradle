plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    compileOnly "com.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

tasks.register("backupToRepo", Copy) {
    dependsOn sourcesJar, jar, shadowJar
    into "G:/Mod Backup Repository/${rootProject.archives_name}"
    into("Source/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from sourcesJar.archiveFile
        from jar.archiveFile
    }
    into("Build/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from shadowJar.archiveFile
    }
    onlyIf {
        (rootProject.buildNumberVal % 2) == 1
    }
}

tasks.register("deployToDev") {
    dependsOn shadowJar, backupToRepo
    doLast {
        def instancesRoot = file("C:/Users/Ddraig__/curseforge/minecraft/Instances")
        def baseNames = ["dev-neoforge-263", "devneoforge263"]
        if (!instancesRoot.exists()) return
        def matchingInstances = instancesRoot.listFiles()?.findAll { dir ->
            dir.isDirectory() && baseNames.any { base ->
                dir.name.equalsIgnoreCase(base) || dir.name.toLowerCase().startsWith(base.toLowerCase() + " (")
            }
        } ?: []
        def cfProfiles = matchingInstances.findAll { new File(it, "minecraftinstance.json").exists() }
        def targets = cfProfiles.isEmpty() ? matchingInstances : cfProfiles
        targets.each { instDir ->
            def modsDir = new File(instDir, "mods")
            if (!modsDir.exists()) modsDir.mkdirs()
            modsDir.listFiles()?.each { f ->
                if (f.name.startsWith("${rootProject.archives_name}-neoforge-") && f.name.endsWith(".jar")) {
                    println "Deleting old deploy jar in ${instDir.name}: ${f.name}"
                    f.delete()
                }
            }
            copy {
                from shadowJar.archiveFile
                into modsDir
            }
            println "Deployed ${shadowJar.archiveFile.get().asFile.name} to ${modsDir.absolutePath}"
        }
    }
}
