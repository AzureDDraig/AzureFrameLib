plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    compileOnly "com.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

tasks.register("backupToRepo", Copy) {
    dependsOn sourcesJar, jar, shadowJar
    into "G:/Mod Backup Repository/${rootProject.archives_name}"

    into("Source/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from sourcesJar.archiveFile
        from jar.archiveFile
    }

    into("Build/${rootProject.minecraft_version}/${project.name}/${rootProject.mod_version}/${rootProject.buildNumberStrVal}") {
        from shadowJar.archiveFile
    }

    onlyIf {
        (rootProject.buildNumberVal % 2) == 1
    }
}

tasks.register("deployToDev", Copy) {
    dependsOn shadowJar, backupToRepo
    from shadowJar.archiveFile
    into "C:/Users/Ddraig__/curseforge/minecraft/Instances/devfabric263/mods"

    doFirst {
        def targetDir = file("C:/Users/Ddraig__/curseforge/minecraft/Instances/devfabric263/mods")
        if (targetDir.exists()) {
            targetDir.listFiles().each { file ->
                if (file.name.startsWith("${rootProject.archives_name}-fabric-") && file.name.endsWith(".jar")) {
                    println "Deleting old deploy jar: ${file.name}"
                    file.delete()
                }
            }
        }
    }
}
